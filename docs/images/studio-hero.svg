<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Engineering Loop Workflow Studio</title>
  <desc id="desc">A dark Workflow Studio live-run view: a stage rail from goal to deliver with review in progress, a pending question banner, compliance chips, a short timeline, and a Start with AI Agent button.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111512"/>
      <stop offset="1" stop-color="#080a09"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#28ad00" stop-opacity=".28"/>
      <stop offset="1" stop-color="#28ad00" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5b625d"/>
    </marker>
    <style>
      .ui{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .eyebrow{font-size:14px;font-weight:700;letter-spacing:2.4px;fill:#7f8881}
      .node-title{font-size:22px;font-weight:700;fill:#f4f6f4}
      .node-copy{font-size:14px;fill:#888f8a}
      .tiny{font-size:12px;fill:#707873}
      .flow{fill:none;stroke:#5b625d;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1240" cy="70" r="330" fill="#28ad00" opacity=".12" filter="url(#soft)"/>
  <circle cx="280" cy="880" r="260" fill="#28ad00" opacity=".08" filter="url(#soft)"/>

  <g class="ui">
    <text x="110" y="112" font-size="16" font-weight="800" letter-spacing="2" fill="#83db69">AI ENGINEERING LOOP</text>
    <text x="110" y="188" font-size="64" font-weight="750" letter-spacing="-2.8" fill="#f7f9f7">From idea to trusted code.</text>
    <text x="112" y="232" font-size="21" fill="#9da49f">Your AI handles the workflow. You keep the clarity and control.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="105" y="290" width="1390" height="510" rx="24" fill="#151816" stroke="#303632"/>
    <rect x="105" y="290" width="1390" height="64" rx="24" fill="#1b1f1c"/>
    <path d="M105 330V354H1495V330" fill="#1b1f1c"/>
    <circle cx="140" cy="322" r="6" fill="#4d544f"/>
    <circle cx="160" cy="322" r="6" fill="#4d544f"/>
    <circle cx="180" cy="322" r="6" fill="#28ad00"/>
    <rect x="680" y="307" width="240" height="30" rx="15" fill="#111411"/>
    <circle cx="704" cy="322" r="6" fill="#28ad00"/>
    <text class="ui tiny" x="720" y="326">Workflow Studio</text>

    <rect x="105" y="354" width="72" height="446" fill="#101311"/>
    <rect x="123" y="381" width="36" height="36" rx="10" fill="#28ad00"/>
    <path d="M129 400h6l3-8 5 16 3-8h6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="141" cy="449" r="15" fill="#252a26"/>
    <path d="M134 444h14M134 449h14M134 454h9" stroke="#818982" stroke-width="2" stroke-linecap="round"/>
    <circle cx="141" cy="500" r="15" fill="#252a26"/>
    <circle cx="135" cy="505" r="3" fill="none" stroke="#818982" stroke-width="2"/>
    <circle cx="147" cy="495" r="3" fill="none" stroke="#818982" stroke-width="2"/>
    <path d="M137.5 502.5l7-5" stroke="#818982" stroke-width="2"/>

    <rect x="177" y="354" width="1318" height="446" fill="#111411"/>
    <rect x="177" y="354" width="1318" height="446" fill="url(#grid)"/>
    <ellipse cx="1220" cy="410" rx="300" ry="210" fill="url(#glow)"/>

    <text class="ui eyebrow" x="222" y="397">LIVE RUN / PRODUCT LAUNCH</text>
    <text class="ui tiny" x="222" y="420">T1 · ASSISTED · iteration 1 / 3 · budget 38%</text>
    <rect x="1180" y="375" width="262" height="42" rx="9" fill="#1d221e" stroke="#343a35"/>
    <circle cx="1206" cy="396" r="6" fill="#28ad00"/>
    <circle cx="1206" cy="396" r="11" fill="none" stroke="#28ad00" stroke-opacity=".35" stroke-width="2"/>
    <text class="ui tiny" x="1224" y="400">live: watch · heartbeat 3s ago</text>

    <rect x="222" y="444" width="1220" height="50" rx="12" fill="#1a2418" stroke="#2f5a22"/>
    <rect x="222" y="444" width="6" height="50" rx="3" fill="#83db69"/>
    <text class="ui" x="248" y="474" font-size="13" font-weight="800" letter-spacing="1.4" fill="#83db69">QUESTION</text>
    <text class="ui" x="340" y="474" font-size="15" fill="#e4e8e5">Should an empty cart show the “Continue shopping” link?</text>
    <rect x="1316" y="456" width="110" height="26" rx="7" fill="#1d221e" stroke="#3b6b2c"/>
    <text class="ui" x="1371" y="474" text-anchor="middle" font-size="12" font-weight="750" fill="#c9f0bd">Answer</text>

    <line x1="300" y1="560" x2="1365" y2="560" stroke="#343a35" stroke-width="4" stroke-linecap="round"/>
    <line x1="300" y1="560" x2="939" y2="560" stroke="#28ad00" stroke-width="4" stroke-linecap="round"/>
    <circle cx="300" cy="560" r="18" fill="#28ad00"/>
    <path d="M293 560l5 5 10-11" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="ui" x="300" y="608" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.6" fill="#c7ccc8">GOAL</text>
    <circle cx="513" cy="560" r="18" fill="#28ad00"/>
    <path d="M506 560l5 5 10-11" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="ui" x="513" y="608" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.6" fill="#c7ccc8">MAKER</text>
    <circle cx="726" cy="560" r="18" fill="#28ad00"/>
    <path d="M719 560l5 5 10-11" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="ui" x="726" y="608" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.6" fill="#c7ccc8">VERIFY</text>
    <circle cx="939" cy="560" r="28" fill="#28ad00" opacity=".18"/>
    <circle cx="939" cy="560" r="18" fill="#1c211d" stroke="#28ad00" stroke-width="4"/>
    <circle cx="939" cy="560" r="6" fill="#28ad00"/>
    <text class="ui" x="939" y="608" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="1.6" fill="#f4f6f4">REVIEW</text>
    <circle cx="1152" cy="560" r="18" fill="#1c211d" stroke="#3b433d" stroke-width="3"/>
    <text class="ui" x="1152" y="608" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.6" fill="#707873">JUDGE</text>
    <circle cx="1365" cy="560" r="18" fill="#1c211d" stroke="#3b433d" stroke-width="3"/>
    <text class="ui" x="1365" y="608" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.6" fill="#707873">DELIVER</text>
    <text class="ui tiny" x="939" y="628" text-anchor="middle" fill="#83db69">Devil's Advocate running</text>

    <rect x="222" y="652" width="600" height="62" rx="12" fill="#191d1a" stroke="#2b312c"/>
    <text class="ui eyebrow" x="246" y="688" font-size="12">COMPLIANCE</text>
    <rect x="384" y="667" width="134" height="32" rx="16" fill="#1c2a18" stroke="#2f5a22"/>
    <circle cx="402" cy="683" r="5" fill="#28ad00"/>
    <text class="ui" x="414" y="688" font-size="13" fill="#c9f0bd">Guard 0 blocks</text>
    <rect x="526" y="667" width="120" height="32" rx="16" fill="#1c2a18" stroke="#2f5a22"/>
    <circle cx="543" cy="683" r="5" fill="#28ad00"/>
    <text class="ui" x="555" y="688" font-size="13" fill="#c9f0bd">Scope in map</text>
    <rect x="654" y="667" width="148" height="32" rx="16" fill="#1d221e" stroke="#343a35"/>
    <circle cx="671" cy="683" r="5" fill="#707873"/>
    <text class="ui" x="683" y="688" font-size="13" fill="#9da49f">Receipt pending</text>

    <rect x="842" y="652" width="600" height="62" rx="12" fill="#191d1a" stroke="#2b312c"/>
    <text class="ui eyebrow" x="866" y="688" font-size="12">TIMELINE</text>
    <text class="mono tiny" x="966" y="677">10:42</text>
    <text class="ui" x="1012" y="677" font-size="13" fill="#c7ccc8">verify · npm test · 511 passed</text>
    <text class="mono tiny" x="966" y="700">10:44</text>
    <text class="ui" x="1012" y="700" font-size="13" fill="#c7ccc8">review · 2 findings, 0 blocking</text>

    <rect x="224" y="734" width="1218" height="44" rx="12" fill="#191d1a" stroke="#2b312c"/>
    <text class="mono tiny" x="248" y="761">Task</text>
    <text class="ui" x="300" y="761" font-size="14" fill="#c7ccc8">Ship a reliable feature without babysitting every command</text>
    <rect x="1250" y="743" width="174" height="26" rx="7" fill="#28ad00"/>
    <text class="ui" x="1337" y="761" text-anchor="middle" font-size="12" font-weight="750" fill="#fff">Start with AI Agent</text>
  </g>

  <g class="ui">
    <text x="112" y="852" font-size="15" fill="#6f7771">Live runs · compliance you can see · evidence you can trust</text>
    <text x="1488" y="852" text-anchor="end" font-size="15" font-weight="700" fill="#28ad00">OPEN SOURCE</text>
  </g>
</svg>
