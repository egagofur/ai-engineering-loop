name: Publish npm manually

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v1.8.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - name: Install OIDC-capable npm CLI
        run: npm install --global npm@11.6.2
      - name: Verify release identity
        run: node scripts/verify-release.js "${{ inputs.tag }}"
      - name: Validate package
        run: npm run prepublishOnly
      - name: Publish with provenance
        run: npm publish --access public --provenance
