<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>AEL Studio</title>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <b class="mark" aria-hidden="true"><span class="mark-eye"></span><span class="mark-eye"></span></b>
      <h1 class="title">AEL <span class="title-sub">Studio</span></h1>
    </div>
    <ul id="overview" class="chips" aria-label="Overview" aria-live="polite"></ul>
    <p id="live" class="live" data-state="connecting" role="status"><span class="live-dot" aria-hidden="true"></span><span class="live-text">Connecting…</span></p>
    <p id="connection" class="connection" role="alert" hidden></p>
  </header>
  <main class="layout">
    <nav class="projects" aria-labelledby="projects-title">
      <h2 id="projects-title" class="section-title">Projects</h2>
      <div id="project-list"></div>
    </nav>
    <section id="run" class="run" aria-label="Selected Run">
      <p id="run-empty" class="empty">Pick a project to see its Run.</p>
      <section id="ring" class="ringbox" aria-label="Run loop" hidden></section>
      <header id="run-head" class="run-head"></header>
      <p id="run-status" class="run-status" role="status"></p>
      <div id="run-detail" class="run-detail"></div>
    </section>
  </main>
</body>
</html>
