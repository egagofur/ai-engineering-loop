<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>AEL Studio</title>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <b class="mark" aria-hidden="true"><span class="mark-eye"></span><span class="mark-eye"></span></b>
      <h1 class="title">AEL <span class="title-sub">Studio</span></h1>
    </div>
    <button type="button" id="projects-toggle" class="projects-toggle" aria-expanded="false" aria-controls="projects">Projects</button>
    <ul id="overview" class="chips" aria-label="Overview" aria-live="polite"></ul>
    <p id="live" class="live" data-state="connecting" role="status"><span class="live-dot" aria-hidden="true"></span><span class="live-text">Connecting…</span></p>
    <p id="connection" class="connection" role="alert" hidden></p>
  </header>
  <main class="layout">
    <nav id="projects" class="projects" aria-labelledby="projects-title">
      <h2 id="projects-title" class="section-title">Projects</h2>
      <div id="project-list"></div>
    </nav>
    <section id="run" class="run" aria-label="Selected Run">
      <p id="run-empty" class="empty">Pick a project to see its Run.</p>
      <section id="ring" class="ringbox" aria-label="Run loop" hidden></section>
      <header id="run-head" class="stage-head"></header>
      <p id="run-status" class="run-status" role="status"></p>
      <button type="button" id="details-open" class="details-button" aria-haspopup="dialog" aria-controls="details-sheet" aria-keyshortcuts="d" hidden>Details <kbd aria-hidden="true">D</kbd></button>
    </section>
  </main>
  <div id="details-sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="details-title" hidden>
    <div class="sheet-backdrop" data-action="close-details"></div>
    <div class="sheet-panel" tabindex="-1">
      <div class="sheet-grab">
        <span class="sheet-handle" aria-hidden="true"></span>
        <h2 id="details-title" class="sheet-title">Run details</h2>
        <button type="button" class="sheet-close" data-action="close-details" aria-label="Close details">Close</button>
      </div>
      <div id="run-detail" class="run-detail"></div>
    </div>
  </div>
</body>
</html>
