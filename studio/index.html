<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>AEL Studio</title>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <header class="appbar">
    <b class="mark" aria-hidden="true">A</b>
    <h1 class="title">AEL Studio</h1>
    <p id="overview" class="overview" aria-live="polite">Loading projects…</p>
    <p id="connection" class="connection" role="status" hidden></p>
  </header>
  <main class="layout">
    <nav class="projects" aria-labelledby="projects-title">
      <h2 id="projects-title" class="section-title">Projects</h2>
      <div id="project-list"></div>
    </nav>
    <section id="run" class="run" aria-label="Selected Run">
      <p id="run-empty" class="empty">Pick a project to see its Run.</p>
      <header id="run-head" class="run-head"></header>
      <p id="run-status" class="run-status" role="status"></p>
      <div id="ring" aria-hidden="true"></div>
      <div id="run-detail" class="run-detail"></div>
    </section>
  </main>
</body>
</html>
